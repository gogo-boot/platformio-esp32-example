; ========================================
; ESP32 Examples - Multi-Environment Setup
; ========================================
; All examples in one project for easy CLion configuration
; Switch between examples using the environment selector

[platformio]
; Set default environment (change as needed)
default_envs = factory-reset

; ========================================
; Common Settings (shared across all envs)
; ========================================
[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    colorize
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ========================================
; GPIO ID Check Example
; ========================================
; Button detector to identify GPIO pins
[env:gpio-id-check]
build_src_filter =
    -<**/>
    +<gpio-id-check/>

; ========================================
; Deep Sleep Button Wakeup Example
; ========================================
; Wake from deep sleep using GPIO buttons
[env:deepsleep-button-wakeup]
build_src_filter =
    -<**/>
    +<deepsleep-button-wakeup/>

; ========================================
; Factory Reset Example
; ========================================
; Press and hold reset button for 5 seconds to erase NVS
[env:factory-reset]
build_src_filter =
    -<**/>
    +<factory-reset/>

; ========================================
; WiFi QR Code Generator Example
; ========================================
; Generates QR code from WiFi credentials
[env:wifi-qrcode]
lib_deps =
    ricmoo/QRCode@^0.0.1
build_src_filter =
    -<**/>
    +<wifi-qrcode/>

; ========================================
; Partial Display update
; ========================================
; Generates QR code from WiFi credentials
[env:partial-update]
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
build_src_filter =
    -<**/>
    +<partial-update/>

