; GPIO ID Check Example - XIAO ESP32S3
; Button detector to identify GPIO pins
[platformio]
default_envs = xiao-esp32s3
[env:xiao-esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
